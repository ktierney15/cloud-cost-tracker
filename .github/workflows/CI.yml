name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      - name: Linting
        run: uv run pylint src --fail-under=7

      - name: Unit testing
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  Version:
    needs: CI
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Get Latest Tag
        id: get-latest-tag
        run: echo "::set-output name=TAG::$(git describe --tags --abbrev=0)"

      - name: Read updated version from toml file
        id: read-version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          echo "::set-output name=VERSION::$VERSION"

      - name: Compare Versions and fail if not updated
        run: |
          if [[ "${{ steps.read-version.outputs.VERSION }}" == "${{ steps.get-latest-tag.outputs.TAG }}" ]]; then
            echo "Version has not been incremented. Please increment version in your pyproject.toml and rerun the pipeline"
            exit 1
          fi

      - name: Update Git tag
        run: |
          VERSION="${{ steps.read-version.outputs.VERSION }}"
          git tag $VERSION
          git push origin $VERSION
