<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Cost Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Cloud Cost Tracker</h1>
      <span id="provider-badge" class="badge" hidden></span>
    </div>
    <div class="controls">
      <label>Range
        <select id="range">
          <option value="this">This month</option>
          <option value="last">Last month</option>
          <option value="3">Last 3 months</option>
          <option value="6">Last 6 months</option>
          <option value="12">Last 12 months</option>
          <option value="custom">Custom…</option>
        </select>
      </label>
      <span id="custom-range" class="custom" hidden>
        <input type="date" id="start" aria-label="Start date">
        <span aria-hidden="true">→</span>
        <input type="date" id="end" aria-label="End date (inclusive)">
      </span>
      <label>Metric
        <select id="metric"></select>
      </label>
      <button id="refresh" type="button" title="Fetch fresh data from AWS">Refresh</button>
    </div>
  </header>

  <main>
    <p id="error" class="error" role="alert" hidden></p>

    <section class="kpis" aria-label="Headline numbers">
      <article class="kpi">
        <h2>Month to date</h2>
        <p class="value" id="kpi-mtd">—</p>
        <p class="sub" id="kpi-mtd-sub"></p>
      </article>
      <article class="kpi">
        <h2>Projected this month</h2>
        <p class="value" id="kpi-proj">—</p>
        <p class="sub" id="kpi-proj-sub"></p>
      </article>
      <article class="kpi">
        <h2>Last month</h2>
        <p class="value" id="kpi-last">—</p>
        <p class="sub" id="kpi-last-sub"></p>
      </article>
      <article class="kpi">
        <h2>Selected range</h2>
        <p class="value" id="kpi-range">—</p>
        <p class="sub" id="kpi-range-sub"></p>
      </article>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Spend over time</h2>
        <label>Split by
          <select id="ts-group"></select>
        </label>
      </div>
      <div class="chart-wrap"><canvas id="ts-chart" aria-label="Spend over time chart" role="img"></canvas></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Where every dollar goes</h2>
        <div class="card-tools">
          <input type="search" id="filter" placeholder="Filter…" aria-label="Filter rows">
          <button id="export" type="button">Export CSV</button>
        </div>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th class="name">Name</th><th class="bar-col">Share</th><th class="num">Cost</th><th class="num">%</th></tr>
          </thead>
          <tbody id="rows"></tbody>
          <tfoot><tr><td>Total <span id="row-count" class="muted"></span></td><td class="bar-col"></td><td class="num" id="foot-total"></td><td class="num">100%</td></tr></tfoot>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
