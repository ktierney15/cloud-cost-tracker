[project]
name = "cloud-cost-tracker"
version = "2.0.0"
description = "Track cloud spend across your whole AWS footprint, with a FastAPI backend and a web dashboard."
authors = [{ name = "Kevin Tierney" }]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[project.scripts]
cost-tracker = "cost_tracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pylint>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
